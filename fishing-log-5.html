<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Catch Log</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --lake:#16423C; --lake-dark:#0F2E29; --canvas:#F3ECD9; --bobber:#E1523D;
    --bobber-dark:#B4472E; --sunline:#F4B41A; --foam:#FBF8F0; --border:#E7DCC0;
    --navy:#14213D; --muted:#8A7C5E; --sky:#8FAEC7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--canvas);font-family:'Nunito',sans-serif;color:var(--navy);}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  #root{min-height:100vh;}

  .header{position:sticky;top:0;z-index:20;background:var(--lake);color:var(--canvas);padding:14px 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .header-top{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;}
  .me-pill{display:flex;align-items:center;gap:6px;background:var(--lake-dark);padding:5px 12px;border-radius:999px;font-weight:700;font-size:14px;border:none;color:var(--canvas);cursor:pointer;}
  .me-pill img{width:20px;height:20px;border-radius:50%;object-fit:cover;}
  .tabbar{display:flex;gap:6px;margin-top:12px;background:var(--lake-dark);padding:4px;border-radius:16px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;font-weight:700;font-size:11px;background:transparent;border:none;color:#CFE3DC;cursor:pointer;}
  .tab.active{background:var(--sunline);color:var(--lake);}
  .tab:disabled{opacity:.35;cursor:not-allowed;}
  .tab .ic{font-size:16px;line-height:1;}

  .content{max-width:460px;margin:0 auto;padding:18px 16px 40px;}
  .section{margin-bottom:22px;}
  .section-title{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--navy);}
  .card{background:var(--foam);border:1.5px solid var(--border);border-radius:16px;padding:14px;}

  .input{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--border);font-family:inherit;font-weight:600;font-size:14px;outline:none;background:#fff;}
  .input:focus{border-color:var(--bobber);}
  .row{display:flex;gap:8px;}
  label.small{font-size:11px;font-weight:800;color:var(--muted);display:block;margin-bottom:2px;}

  .btn{width:100%;padding:12px;border-radius:14px;font-weight:800;font-size:14px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
  .btn-primary{background:var(--lake);color:#fff;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-accent{background:var(--bobber);color:#fff;}
  .btn-accent:disabled{opacity:.4;cursor:not-allowed;}
  .btn-outline{background:transparent;border:2px dashed var(--sky);color:var(--lake);}
  .btn-ghost{background:var(--foam);border:2px solid var(--border);color:var(--lake);font-size:13px;padding:9px 12px;}

  .chip{padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px;border:2px solid var(--border);background:var(--foam);color:#5A4E37;cursor:pointer;}
  .chip.active{border-color:transparent;background:var(--bobber);color:#fff;}
  .chip-wrap{display:flex;flex-wrap:wrap;gap:7px;}
  .color-chip{display:flex;align-items:center;gap:7px;padding:6px 14px 6px 6px;border-radius:999px;border:2px solid var(--border);background:var(--foam);font-weight:700;font-size:13px;cursor:pointer;}
  .color-chip.active{border-color:var(--bobber);background:#FDECE7;}
  .swatch{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}

  /* ---- Gear wizard: big cartoon selection cards ---- */
  @keyframes popSelect{0%{transform:scale(1);}45%{transform:scale(1.12);}100%{transform:scale(1);}}
  .wiz-header{text-align:center;margin-bottom:16px;}
  .wiz-mascot{font-size:44px;line-height:1;margin-bottom:4px;display:block;}
  .wiz-title{font-size:20px;font-weight:800;}
  .wiz-sub{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:2px;}
  .wiz-dots{display:flex;justify-content:center;gap:7px;margin-bottom:18px;}
  .wiz-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:all .2s;}
  .wiz-dot.done{background:var(--lake);}
  .wiz-dot.current{background:var(--bobber);width:22px;border-radius:6px;}

  .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .option-card{position:relative;border:3px solid var(--border);border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;background:var(--foam);font-family:inherit;transition:transform .12s, border-color .12s, box-shadow .12s;box-shadow:0 2px 0 rgba(0,0,0,.05);}
  .option-card:active{transform:scale(.96);}
  .option-card .oc-icon{font-size:30px;display:block;margin-bottom:6px;}
  .option-card .oc-label{font-weight:800;font-size:13px;color:var(--navy);line-height:1.2;}
  .option-card.selected{border-color:var(--bobber);box-shadow:0 3px 0 var(--bobber-dark);animation:popSelect .25s ease;}
  .option-card.selected::after{content:'✓';position:absolute;top:-8px;right:-8px;background:var(--bobber);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;border:2px solid var(--foam);}
  .option-card.custom-card{border-style:dashed;border-color:var(--sky);color:var(--lake);}
  .option-card .oc-swatch{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;border:2px solid rgba(0,0,0,.12);}

  .custom-input-row{display:flex;gap:8px;margin:-4px 0 14px;}
  .custom-input-row input{flex:1;}
  .custom-input-row button{width:44px;flex-shrink:0;border-radius:12px;border:none;background:var(--lake);color:#fff;font-weight:800;font-size:16px;cursor:pointer;}

  .wiz-nav{display:flex;gap:10px;margin-top:6px;}
  .wiz-nav .btn{flex:1;}
  .btn-back{background:var(--foam);border:2px solid var(--border);color:var(--muted);}

  /* ---- Home: full-bleed hero image with clickable hotspots ---- */
  .hero-stage{position:relative;width:100%;line-height:0;background:#0E4C7A;animation:heroFade .35s ease both;}
  @keyframes heroFade{from{opacity:0;}to{opacity:1;}}
  .hero-full{width:100%;display:block;}
  .hotspot{position:absolute;background:transparent;border:none;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .hotspot:active{background:rgba(255,255,255,.22);border-radius:16px;}
  .hotspot:focus-visible{outline:3px solid #fff;outline-offset:-3px;border-radius:16px;}

  .avatar-circle{width:64px;height:64px;border-radius:50%;background:#EDE6D6;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0;}
  .avatar-circle img{width:100%;height:100%;object-fit:cover;}
  .avatar-pick{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);font-size:22px;background:var(--foam);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s, border-color .12s;}
  .avatar-pick:active{transform:scale(.9);}
  .avatar-pick.active{border-color:var(--bobber);background:#FDECE7;animation:popSelect .25s ease;}

  .angler-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:2px solid var(--border);background:var(--foam);cursor:pointer;text-align:left;margin-bottom:8px;}
  .angler-row.active{border-color:var(--bobber);}
  .angler-av{width:44px;height:44px;border-radius:50%;background:#EDE6D6;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0;}
  .angler-av img{width:100%;height:100%;object-fit:cover;}
  .angler-name{font-weight:800;color:var(--navy);}
  .angler-sub{font-size:12px;color:var(--muted);}

  .empty{text-align:center;padding:36px 16px;border-radius:16px;border:2px dashed var(--border);background:rgba(251,248,240,.6);}
  .empty .big{font-size:26px;margin-bottom:6px;}
  .empty p{font-weight:800;margin:2px 0;}
  .empty span{font-size:13px;color:var(--muted);}

  #mapContainer, #spotsMapEl{width:100%;height:230px;border-radius:16px;border:2px solid var(--border);margin-bottom:8px;}
  .coords-note{font-size:12px;color:var(--muted);}
  .loc-note{font-size:12px;color:var(--bobber-dark);font-weight:700;}

  .combo-chip{display:inline-flex;align-items:center;gap:6px;background:#EDE6D6;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--navy);}
  .combo-chip .x{cursor:pointer;font-weight:900;color:var(--muted);}

  .catch-card{background:var(--foam);border:1.5px solid var(--border);border-radius:16px;padding:12px;position:relative;margin-bottom:10px;}
  .catch-x{position:absolute;top:8px;right:8px;background:none;border:none;font-size:16px;color:var(--muted);cursor:pointer;}
  .measure-input{flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;border:2px solid var(--border);background:#fff;}
  .measure-input input{border:none;outline:none;width:100%;font-weight:700;font-size:13px;background:transparent;}
  .ruler{background-image:repeating-linear-gradient(90deg, transparent, transparent 9px, var(--border) 9px, var(--border) 10px);background-position:0 bottom;background-size:100% 5px;background-repeat:no-repeat;}
  .catch-photo-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--lake);background:#EDE6D6;padding:6px 10px;border-radius:10px;border:none;cursor:pointer;margin-top:8px;}
  .catch-photo-preview{margin-top:8px;width:100%;max-height:150px;object-fit:cover;border-radius:12px;}

  .lb-tabs{display:flex;gap:6px;margin-bottom:16px;background:#EDE6D6;padding:4px;border-radius:12px;}
  .lb-tab{flex:1;padding:7px;border-radius:9px;font-weight:800;font-size:13px;border:none;background:transparent;color:#5A4E37;cursor:pointer;}
  .lb-tab.active{background:var(--lake);color:#fff;}

  .catch-entry{display:flex;align-items:center;gap:10px;background:var(--foam);padding:9px;border-radius:16px;border:1.5px solid var(--border);margin-bottom:8px;}
  .catch-entry .rank{width:28px;text-align:center;font-weight:800;color:var(--muted);}
  .catch-entry .thumb{width:44px;height:44px;border-radius:12px;background:#EDE6D6;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;flex-shrink:0;}
  .catch-entry .thumb img{width:100%;height:100%;object-fit:cover;}
  .catch-entry .mid{flex:1;min-width:0;}
  .catch-entry .mid p{margin:0;}
  .catch-entry .species{font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .catch-entry .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .catch-entry .stats{text-align:right;flex-shrink:0;}
  .catch-entry .wt{font-weight:800;color:var(--bobber);font-size:13px;margin:0;}
  .catch-entry .ln{font-size:11px;color:var(--muted);margin:0;}

  .spot-block{margin-bottom:16px;}
  .spot-block .spot-title{font-weight:800;font-size:13px;color:var(--navy);margin-bottom:6px;display:flex;align-items:center;gap:5px;}

  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:28px;}
  .fallback-note{background:#FDECE7;border:1.5px solid var(--bobber);color:var(--bobber-dark);font-size:12px;font-weight:700;padding:8px 12px;border-radius:12px;margin:10px 16px 0;}

  /* ---- Game-style panel screens: Trophies / Gear / Locations ---- */
  .gm-screen{min-height:100vh;display:flex;flex-direction:column;}
  .gm-header{position:relative;padding:16px 50px 14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .gm-header .gm-hicon{font-size:26px;}
  .gm-header .gm-htitle{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;color:#FFD34D;letter-spacing:.5px;text-shadow:-1.5px 0 #5a3d00, 1.5px 0 #5a3d00, 0 -1.5px #5a3d00, 0 1.5px #5a3d00, 2px 2px 0 rgba(0,0,0,.35);}
  .gm-close{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #FF6B5C, #C6392C);border:2px solid #fff;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .gm-close:active{transform:translateY(-50%) scale(.9);}
  .gm-theme-blue .gm-header{background:linear-gradient(180deg,#2E86D8,#1B5FA6);}
  .gm-theme-blue{background:linear-gradient(180deg,#1B5FA6 0%,#0E3F73 100%);}
  .gm-theme-purple .gm-header{background:linear-gradient(180deg,#8B4FE0,#6528B0);}
  .gm-theme-purple{background:linear-gradient(180deg,#6528B0 0%,#3E1970 100%);}
  .gm-theme-orange .gm-header{background:linear-gradient(180deg,#E8922E,#C2650F);}
  .gm-theme-orange{background:linear-gradient(180deg,#C2650F 0%,#7A3E08 100%);}
  .gm-theme-teal .gm-header{background:linear-gradient(180deg,#2FBFB0,#1C8A7E);}
  .gm-theme-teal{background:linear-gradient(180deg,#1C8A7E 0%,#0F5850 100%);}
  .gm-theme-slate .gm-header{background:linear-gradient(180deg,#8A94A6,#5C6579);}
  .gm-theme-slate{background:linear-gradient(180deg,#5C6579 0%,#33394A 100%);}

  .gm-tabs{display:flex;gap:6px;padding:12px 14px 0;}
  .gm-tab{flex:1;padding:9px 4px;border-radius:10px;background:rgba(0,0,0,.28);color:#EAF2FF;font-weight:800;font-size:11.5px;letter-spacing:.3px;border:none;cursor:pointer;font-family:inherit;}
  .gm-tab.active{background:linear-gradient(180deg,#8BC34A,#5C9A2A);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25);}

  .gm-body{flex:1;padding:14px;overflow-y:auto;}
  .wood-banner{background:linear-gradient(180deg,#9A6B3D,#6E4A26);border:2px solid #4A2F16;border-radius:10px;padding:8px 12px;text-align:center;color:#FFD34D;font-weight:800;font-size:13px;letter-spacing:.4px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);}

  .rank-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:14px;padding:9px;margin-bottom:8px;}
  .rank-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;color:#fff;}
  .rank-badge.gold{background:radial-gradient(circle at 35% 30%,#FFE07A,#E0A417);color:#5a3d00;}
  .rank-badge.silver{background:radial-gradient(circle at 35% 30%,#F0F0F0,#B9B9B9);color:#444;}
  .rank-badge.bronze{background:radial-gradient(circle at 35% 30%,#E5A56C,#B5672E);}
  .rank-badge.plain{background:rgba(255,255,255,.15);}
  .rank-thumb{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex-shrink:0;}
  .rank-thumb img{width:100%;height:100%;object-fit:cover;}
  .rank-mid{flex:1;min-width:0;}
  .rank-mid .rank-species{font-weight:800;color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-mid .rank-sub{font-size:11px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-wt{font-weight:800;color:#FFD34D;font-size:14px;text-align:right;flex-shrink:0;}

  .gm-footer{display:flex;gap:10px;padding:12px 14px;background:rgba(0,0,0,.2);}
  .gm-back-btn{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;}
  .gm-action-btn{flex:1;border:none;border-radius:14px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.3);}
  .gm-action-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
  .gm-action-btn.blue{background:linear-gradient(180deg,#4FA8E8,#1D6FC4);}
  .gm-action-btn.purple{background:linear-gradient(180deg,#B072E8,#7B3FC4);}
  .gm-action-btn.orange{background:linear-gradient(180deg,#F5A94E,#E07B1D);}
  .gm-action-btn.green{background:linear-gradient(180deg,#8BC34A,#4E8C2A);}
  .gm-action-btn.teal{background:linear-gradient(180deg,#2FBFB0,#1C8A7E);}
  .gm-action-btn.slate{background:linear-gradient(180deg,#8A94A6,#5C6579);}
  .gm-action-btn.active{outline:2px solid #FFD34D;}

  .gm-empty{text-align:center;padding:34px 14px;color:rgba(255,255,255,.75);}
  .gm-empty .big{font-size:26px;margin-bottom:6px;}

  /* Gear carousel */
  .carousel-wrap{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .carousel-arrow{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;}
  .carousel-arrow:active{transform:scale(.9);}
  .carousel-card{flex:1;background:linear-gradient(180deg,#F3ECD9,#E7DCC0);border:3px solid #6E4A26;border-radius:16px;padding:16px;text-align:center;}
  .carousel-card .cc-icon{font-size:36px;display:block;margin-bottom:6px;}
  .carousel-card .cc-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;color:var(--navy);margin-bottom:10px;}
  .carousel-card .cc-input{width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--border);font-weight:700;text-align:center;margin-bottom:10px;}
  .cc-equip-btn{width:100%;border:none;border-radius:10px;padding:9px;font-weight:800;font-family:'Baloo 2',sans-serif;font-size:14px;cursor:pointer;}
  .cc-equip-btn.equipped{background:linear-gradient(180deg,#8BC34A,#4E8C2A);color:#fff;}
  .cc-equip-btn.not-equipped{background:linear-gradient(180deg,#4FA8E8,#1D6FC4);color:#fff;}
  .carousel-dots{display:flex;justify-content:center;gap:5px;margin-bottom:14px;}
  .carousel-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);}
  .carousel-dots span.active{background:#FFD34D;}

  .tackle-section-title{color:#FFD34D;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;margin:14px 0 8px;display:flex;align-items:center;gap:6px;}
  .tk-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .tk-card{position:relative;border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-family:inherit;}
  .tk-card .tk-icon{font-size:22px;display:block;margin-bottom:4px;}
  .tk-card .tk-label{font-weight:700;font-size:11.5px;}
  .tk-card.selected{border-color:#FFD34D;background:rgba(255,211,77,.18);}
  .tk-card.selected::after{content:'✓';position:absolute;top:-6px;right:-6px;background:#FFD34D;color:#5a3d00;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .tk-swatch{width:22px;height:22px;border-radius:50%;margin:0 auto 4px;border:2px solid rgba(255,255,255,.4);}
  .tk-custom-row{display:flex;gap:8px;margin:6px 0 4px;}
  .tk-custom-row input{flex:1;border-radius:10px;border:2px solid rgba(255,255,255,.25);padding:8px 10px;background:rgba(255,255,255,.9);font-weight:700;}
  .tk-custom-row button{width:38px;border-radius:10px;border:none;background:#FFD34D;color:#5a3d00;font-weight:900;font-size:16px;cursor:pointer;}

  /* Locations */
  .loc-card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:16px;padding:9px;margin-bottom:9px;}
  .loc-thumb{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;color:#fff;}
  .loc-mid{flex:1;min-width:0;}
  .loc-mid .loc-name{font-weight:800;color:#fff;font-size:14px;}
  .loc-mid .loc-coords{font-size:10.5px;color:rgba(255,255,255,.65);}
  .loc-mid .loc-best{font-size:11.5px;color:#FFD34D;font-weight:700;margin-top:1px;}

/* =========================================================
   STORAGE (shared cloud data across all anglers)
   Falls back to in-memory storage if opened outside Claude
========================================================= */
let usingFallbackStorage = false;
if(!window.storage){
  usingFallbackStorage = true;
  const mem = {};
  window.storage = {
    async get(key){ return mem[key] !== undefined ? {key, value: mem[key], shared:true} : null; },
    async set(key, value){ mem[key] = value; return {key, value, shared:true}; },
    async delete(key){ delete mem[key]; return {key, deleted:true, shared:true}; },
    async list(prefix){ return {keys: Object.keys(mem).filter(k => !prefix || k.startsWith(prefix))}; }
  };
}

async function loadShared(key, fallback){
  try{ const res = await window.storage.get(key, true); return res ? JSON.parse(res.value) : fallback; }
  catch{ return fallback; }
}
async function saveShared(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), true); } catch(e){ console.error('save failed', key, e); }
}

/* =========================================================
   BOOT
========================================================= */
async function init(){
  const [p,g,s,sp] = await Promise.all([loadShared('profiles',[]), loadShared('gear',{}), loadShared('sessions',[]), loadShared('spots',[])]);
  state.profiles = p; state.gearMap = g; state.sessions = s; state.spots = sp; state.loading = false;
  if(state.profiles.length === 0) creatingProfile = true;
  render();
}
init();

========================================================= */
async function persistProfiles(){ await saveShared('profiles', state.profiles); }
async function persistGear(){ await saveShared('gear', state.gearMap); }

async function persistSpots(){ await saveShared('spots', state.spots); }

========================================================= */
function compressImage(file, maxDim=480, quality=0.6){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let {width, height} = img;
        if(width > height && width > maxDim){ height *= maxDim/width; width = maxDim; }
        else if(height > maxDim){ width *= maxDim/height; height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setTab(t){
  state.tab = t;
  if(t==='gear' && state.me){
    const g = state.gearMap[state.me];
    gearDraft = g ? {...g, baits:[...g.baits], colors:[...g.colors], liveBait:[...g.liveBait]} : {rodBrand:'', reelBrand:'', baits:[], colors:[], liveBait:[]};
    gearDraft.custom = {rodBrand:[], reelBrand:[], baits:[], colors:[], liveBait:[]};
    // if previously chosen values aren't in the preset lists, treat them as custom write-ins so they still show as cards
    if(gearDraft.rodBrand && !ROD_BRANDS.includes(gearDraft.rodBrand)) gearDraft.custom.rodBrand.push(gearDraft.rodBrand);
    if(gearDraft.reelBrand && !REEL_BRANDS.includes(gearDraft.reelBrand)) gearDraft.custom.reelBrand.push(gearDraft.reelBrand);
    gearDraft.baits.forEach(b=>{ if(!BAIT_STYLES.includes(b)) gearDraft.custom.baits.push(b); });
    gearDraft.colors.forEach(c=>{ if(!LURE_COLORS.some(lc=>lc.name===c)) gearDraft.custom.colors.push(c); });
    gearDraft.liveBait.forEach(b=>{ if(!LIVE_BAIT.includes(b)) gearDraft.custom.liveBait.push(b); });
    gearTab = 'rods';
    const rodOptions = [...ROD_BRANDS, ...gearDraft.custom.rodBrand];
    const reelOptions = [...REEL_BRANDS, ...gearDraft.custom.reelBrand];
    gearRodIdx = Math.max(0, rodOptions.indexOf(gearDraft.rodBrand));
    gearReelIdx = Math.max(0, reelOptions.indexOf(gearDraft.reelBrand));
  }
  if(t==='leaderboards'){ myRecordsOnly = false; }
  if(t==='locations'){ locTab = 'freshwater'; addingLocation = false; }
  render();
}

  if(state.tab === 'leaderboards' || state.tab === 'gear' || state.tab === 'locations' || state.tab === 'anglers' || state.tab === 'settings'){

function carouselMove(field, dir){
  const opts = field==='rodBrand' ? rodOptions() : reelOptions();
  const totalSlots = opts.length + 1; // +1 for the "type your own" slot
  let idx = field==='rodBrand' ? gearRodIdx : gearReelIdx;
  idx = (idx + dir + totalSlots) % totalSlots;
  if(field==='rodBrand') gearRodIdx = idx; else gearReelIdx = idx;
  render();
}

function equipCarousel(field){
  const opts = field==='rodBrand' ? rodOptions() : reelOptions();
  const idx = field==='rodBrand' ? gearRodIdx : gearReelIdx;
  if(idx >= opts.length) return;
  gearDraft[field] = opts[idx];
  persistCurrentGear();
  render();
}

function addCustomCarousel(field){
  const inputId = field==='rodBrand' ? 'customRodInput' : 'customReelInput';
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if(!val) return;
  if(!gearDraft.custom[field].includes(val)) gearDraft.custom[field].push(val);
  gearDraft[field] = val;
  const opts = field==='rodBrand' ? rodOptions() : reelOptions();
  if(field==='rodBrand') gearRodIdx = opts.length - 1; else gearReelIdx = opts.length - 1;
  persistCurrentGear();
  render();
}

function toggleGearMulti(field, val){
  const arr = gearDraft[field];
  const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  persistCurrentGear();
  render();
}

    <div class="section-title">⚓ Equipped</div>

      <div class="option-card" style="cursor:default;flex:1;"><span class="oc-icon">🎣</span><span class="oc-label">${esc(gear.rodBrand)||'No rod set'}</span></div>
      <div class="option-card" style="cursor:default;flex:1;"><span class="oc-icon">🌀</span><span class="oc-label">${esc(gear.reelBrand)||'No reel set'}</span></div>
    </div>
  `;
  if(gear.baits.length){
    html += `<div class="section-title">🪝 Bait Styles</div><div class="option-grid">${gear.baits.map(b=>{
      const active = sessionDraft.tackle.baits.includes(b);
      return `<button type="button" class="option-card ${active?'selected':''}" onclick="toggleTackle('baits','${esc(b).replace(/'/g,"\\'")}')"><span class="oc-icon">${BAIT_ICONS[b]||'🪝'}</span><span class="oc-label">${esc(b)}</span></button>`;
    }).join('')}</div>`;
  }
  if(gear.colors.length){
    html += `<div class="section-title">🎨 Colors</div><div class="option-grid">${gear.colors.map(c=>{
      const preset = LURE_COLORS.find(lc=>lc.name===c);
      const active = sessionDraft.tackle.colors.includes(c);
      return `<button type="button" class="option-card ${active?'selected':''}" onclick="toggleTackle('colors','${esc(c).replace(/'/g,"\\'")}')"><span class="oc-swatch" style="background:${preset?preset.hex:'#B7B09A'}"></span><span class="oc-label">${esc(c)}</span></button>`;
    }).join('')}</div>`;
  }
  if(gear.liveBait.length){
    html += `<div class="section-title">🪱 Live Bait</div><div class="option-grid">${gear.liveBait.map(b=>{
      const active = sessionDraft.tackle.liveBait.includes(b);
      return `<button type="button" class="option-card ${active?'selected':''}" onclick="toggleTackle('liveBait','${esc(b).replace(/'/g,"\\'")}')"><span class="oc-icon">${LIVEBAIT_ICONS[b]||'🪱'}</span><span class="oc-label">${esc(b)}</span></button>`;
    }).join('')}</div>`;
  }
  if(!gear.baits.length && !gear.colors.length && !gear.liveBait.length){
    html += emptyHTML("Your tacklebox is empty", "You can still head out — add gear anytime from the Cabana.");
  }
  html += `
    <div class="wiz-nav">
      <button class="btn btn-back" onclick="setTab('home')">🏖️ Cabana</button>
      <button class="btn btn-accent" onclick="fishStep=1;render()">Next →</button>
    </div>
  `;
  return html;
}

/* ---- Step 2: Choose Your Spot (map) ---- */
function pinIcon(){ return L.divIcon({html:'<div style="font-size:26px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));">📍</div>', className:'', iconSize:[26,26], iconAnchor:[13,26]}); }

function initSessionMap(){
  const el = document.getElementById('mapContainer');
  if(!el || typeof L === 'undefined') return;
  sessionMap = L.map('mapContainer', {zoomControl:true}).setView([39.8283,-98.5795], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(sessionMap);

  // reference pins for spots other anglers have already fished
  const seen = {};
  state.sessions.forEach(s=>{
    if(s.lat==null || s.lng==null || seen[s.spotName]) return;
    seen[s.spotName] = true;
    L.circleMarker([s.lat,s.lng], {radius:7, color:'#8FAEC7', weight:2, fillColor:'#8FAEC7', fillOpacity:.7})
      .addTo(sessionMap).bindPopup(`<b>${esc(s.spotName)}</b><br>previously logged`);
  });

  sessionMap.on('click', (e) => setSessionPin(e.latlng.lat, e.latlng.lng));

  if(sessionDraft.lat != null) setSessionPin(sessionDraft.lat, sessionDraft.lng, true);
}

function setSessionPin(lat, lng, skipZoom){
  sessionDraft.lat = lat; sessionDraft.lng = lng;
  if(sessionMarker){ sessionMarker.setLatLng([lat,lng]); }
  else{
    sessionMarker = L.marker([lat,lng], {draggable:true, icon: pinIcon()}).addTo(sessionMap);
    sessionMarker.on('dragend', () => { const p = sessionMarker.getLatLng(); sessionDraft.lat=p.lat; sessionDraft.lng=p.lng; updateCoordsDisplay(); });
  }
  if(!skipZoom) sessionMap.setView([lat,lng], 14);
  updateCoordsDisplay();
}

function updateCoordsDisplay(){
  const el = document.getElementById('coordsDisplay');
  if(el) el.innerHTML = sessionDraft.lat!=null ? `📌 ${sessionDraft.lat.toFixed(4)}, ${sessionDraft.lng.toFixed(4)} — drag the pin to line it up exactly` : '';
}

function useMyLocation(){
  const btn = document.getElementById('locBtn');
  if(!navigator.geolocation){ btn.innerHTML = "GPS not available — tap the map to drop a pin"; return; }
  btn.innerHTML = '📍 Locating…';
  navigator.geolocation.getCurrentPosition(
    (pos) => { setSessionPin(pos.coords.latitude, pos.coords.longitude); btn.innerHTML = '📍 Location Pinned ✓ — drag to adjust'; },
    () => { btn.innerHTML = "Couldn't get GPS — tap the map to drop a pin manually"; },
    {enableHighAccuracy:true, timeout:8000}
  );
}

function syncFishNextBtn(){
  const btn = document.getElementById('fishNextBtn');
  if(btn) btn.disabled = !sessionDraft.spotName.trim();
}

function renderLocationStep(){
  return `
    <div class="card" style="margin-bottom:16px;">
      <input class="input" id="spotNameInput" placeholder="Name this spot (e.g. Miller's Pond)" value="${esc(sessionDraft.spotName)}" oninput="sessionDraft.spotName=this.value;syncFishNextBtn()" style="margin-bottom:8px;">
      <div id="mapContainer"></div>
      <button class="btn btn-ghost" id="locBtn" onclick="useMyLocation()">📍 Drop a Pin (use my location)</button>
      <p class="coords-note" id="coordsDisplay" style="margin-top:6px;">${sessionDraft.lat!=null ? `📌 ${sessionDraft.lat.toFixed(4)}, ${sessionDraft.lng.toFixed(4)} — drag the pin to line it up exactly` : 'Tap the map or use GPS to drop your pin — drag it to line it up exactly.'}</p>
    </div>
    <div class="wiz-nav">
      <button class="btn btn-back" onclick="fishStep=0;render()">← Back</button>
      <button class="btn btn-accent" id="fishNextBtn" onclick="fishStep=2;render()" ${sessionDraft.spotName.trim()?'':'disabled'}>Next →</button>
    </div>
  `;
}

/* ---- Step 3: Log Your Catches ---- */
function renderLogStep(){
  return `
    <div class="section">
      <div class="section-title">⏱️ Time</div>
      <div class="row">
        <div style="flex:1;"><label class="small">START</label><input type="datetime-local" class="input" value="${sessionDraft.startTime}" oninput="sessionDraft.startTime=this.value"></div>
        <div style="flex:1;"><label class="small">END</label><input type="datetime-local" class="input" value="${sessionDraft.endTime}" oninput="sessionDraft.endTime=this.value"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">⚓ Combos Tried</div>
      <div class="row" style="margin-bottom:8px;">
        <input class="input" id="comboInput" placeholder="e.g. Chartreuse spinnerbait" style="flex:1;" onkeydown="if(event.key==='Enter')addCombo()">
        <button class="btn btn-primary" style="width:44px;flex-shrink:0;" onclick="addCombo()">＋</button>
      </div>
      <div class="chip-wrap" id="combosList">${renderCombosInner()}</div>
    </div>

    <div class="section">
      <div class="section-title">🐟 Catches</div>
      <div id="catchesList">${renderCatchesInner()}</div>
      <button class="btn btn-outline" style="margin-top:8px;" onclick="addCatch()">＋ Log a Catch</button>
    </div>

    <div class="wiz-nav">
      <button class="btn btn-back" onclick="fishStep=1;render()">← Back</button>
      <button class="btn btn-accent" onclick="saveSession()">Finish Session ✓</button>
    </div>
  `;
}

function renderCombosInner(){
  return sessionDraft.combos.map((c,i)=>`<span class="combo-chip">${esc(c)} <span class="x" onclick="removeCombo(${i})">✕</span></span>`).join('');
}
function addCombo(){
  const input = document.getElementById('comboInput');
  const v = input.value.trim();
  if(v){ sessionDraft.combos.push(v); input.value=''; document.getElementById('combosList').innerHTML = renderCombosInner(); }
}
function removeCombo(i){ sessionDraft.combos.splice(i,1); document.getElementById('combosList').innerHTML = renderCombosInner(); }

function renderCatchesInner(){
  return sessionDraft.catches.map(c => `
    <div class="catch-card">
      <button class="catch-x" onclick="removeCatch('${c.id}')">✕</button>
      <input class="input" placeholder="Species (e.g. Largemouth Bass)" value="${esc(c.species)}" oninput="updateCatch('${c.id}','species',this.value)" style="margin-bottom:8px;font-weight:800;">
      <div class="row" style="margin-bottom:8px;">
        <div class="measure-input"><span>⚖️</span><input placeholder="lbs" value="${esc(c.weight)}" inputmode="decimal" oninput="updateCatch('${c.id}','weight',this.value.replace(/[^0-9.]/g,''))"></div>
        <div class="measure-input ruler"><span>📏</span><input placeholder="in" value="${esc(c.length)}" inputmode="decimal" oninput="updateCatch('${c.id}','length',this.value.replace(/[^0-9.]/g,''))"></div>
      </div>
      <button type="button" class="catch-photo-btn" onclick="document.getElementById('photo_${c.id}').click()">📷 ${c.photo ? 'Photo Added ✓' : 'Add Photo (optional)'}</button>
      <input type="file" id="photo_${c.id}" accept="image/*" style="display:none" onchange="handleCatchPhoto(event,'${c.id}')">
      ${c.photo ? `<img class="catch-photo-preview" src="${c.photo}">` : ''}
    </div>
  `).join('');
}
function addCatch(){
  sessionDraft.catches.push({ id:`c_${Date.now()}_${Math.random().toString(36).slice(2,5)}`, species:'', weight:'', length:'', photo:null, time:new Date().toISOString() });
  document.getElementById('catchesList').innerHTML = renderCatchesInner();
}
function removeCatch(id){
  sessionDraft.catches = sessionDraft.catches.filter(c=>c.id!==id);
  document.getElementById('catchesList').innerHTML = renderCatchesInner();
}
function updateCatch(id, field, value){
  const c = sessionDraft.catches.find(c=>c.id===id);
  if(c) c[field] = value;
}
async function handleCatchPhoto(e, id){
  const f = e.target.files[0]; if(!f) return;
  try{
    const dataUrl = await compressImage(f);
    updateCatch(id, 'photo', dataUrl);
    document.getElementById('catchesList').innerHTML = renderCatchesInner();
  }catch(err){ console.error(err); }
}

async function saveSession(){
  if(!sessionDraft.spotName.trim()) return;
  const session = {
    id: `s_${Date.now()}`,
    profileId: state.me,
    spotName: sessionDraft.spotName.trim(),
    lat: sessionDraft.lat, lng: sessionDraft.lng,
    startTime: sessionDraft.startTime, endTime: sessionDraft.endTime,
    tackle: sessionDraft.tackle,
    combos: sessionDraft.combos,
    catches: sessionDraft.catches.filter(c=>c.species.trim()).map(c => ({...c, weight: c.weight?Number(c.weight):null, length: c.length?Number(c.length):null})),
    loggedAt: new Date().toISOString()
  };
  state.sessions.push(session);
  await persistSessions();
  sessionSaved = true;
  render();
}

/* =========================================================
   LEADERBOARDS TAB
========================================================= */
function flattenCatches(filterFn){
  const byId = Object.fromEntries(state.profiles.map(p=>[p.id,p]));
  const out = [];
  state.sessions.forEach(s => {
    (s.catches||[]).forEach(c => {
      if(filterFn && !filterFn(s,c)) return;
      out.push({ catch:c, session:s, angler: byId[s.profileId] });
    });
  });
  return out.sort((a,b) => {
    const aw=a.catch.weight, bw=b.catch.weight;
    if(aw!=null && bw!=null) return bw-aw;
    if(aw!=null) return -1;
    if(bw!=null) return 1;
    return (b.catch.length||0)-(a.catch.length||0);
  });
}

function rankRowHTML(entry, rank){
  const {catch:c, session, angler} = entry;
  const badgeClass = rank===0?'gold':rank===1?'silver':rank===2?'bronze':'plain';
  const badgeContent = rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`${rank+1}`;
  return `
    <div class="rank-row">
      <div class="rank-badge ${badgeClass}">${badgeContent}</div>
      <div class="rank-thumb">${c.photo?`<img src="${c.photo}">`:'🐟'}</div>
      <div class="rank-mid">
        <p class="rank-species">${esc(c.species)||'Unknown fish'}</p>
        <p class="rank-sub">${angler?`${esc(angler.firstName)} ${esc(angler.lastInitial)}.`:'Unknown'} · ${esc(session.spotName)}${c.time?' · '+fmtShortDate(c.time):''}</p>
      </div>
      <div class="rank-wt">${c.weight!=null?c.weight+' lb':c.length!=null?c.length+' in':''}</div>
    </div>`;
}

function emptyHTML(text, sub){
  return `<div class="empty"><div class="big">🌊</div><p>${text}</p>${sub?`<span>${sub}</span>`:''}</div>`;
}
function gmEmpty(text, sub){
  return `<div class="gm-empty"><div class="big">🌊</div><p style="font-weight:800;color:#fff;margin:0 0 4px;">${text}</p>${sub?`<span style="font-size:12px;">${sub}</span>`:''}</div>`;
}

function renderLeaderboards(){
  return `
    <div class="gm-screen gm-theme-blue">
      <div class="gm-header">
        <span class="gm-hicon">🏆</span>
        <span class="gm-htitle">TROPHIES</span>
        <button class="gm-close" onclick="setTab('home')">✕</button>
      </div>
      <div class="gm-tabs">
        <button class="gm-tab ${lbView==='daily'?'active':''}" onclick="lbView='daily';render()">DAILY</button>
        <button class="gm-tab ${lbView==='spots'?'active':''}" onclick="lbView='spots';render()">LOCATION</button>
        <button class="gm-tab ${lbView==='lifetime'?'active':''}" onclick="lbView='lifetime';render()">ALL TIME</button>
      </div>
      <div class="gm-body">${renderLbContent()}</div>
      <div class="gm-footer">
        <button class="gm-back-btn" onclick="setTab('home')">←</button>
        <button class="gm-action-btn blue ${myRecordsOnly?'active':''}" onclick="myRecordsOnly=!myRecordsOnly;render()">👤 ${myRecordsOnly?'ALL RECORDS':'MY RECORDS'}</button>
      </div>
    </div>
  `;
}

function renderLbContent(){
  const meFilter = (s) => !myRecordsOnly || s.profileId === state.me;
  if(lbView==='daily'){
    const daily = flattenCatches((s,c)=> (c.time||s.loggedAt||'').slice(0,10)===todayStr() && meFilter(s));
    return `<div class="wood-banner">BEST FISH TODAY</div>${daily.length===0?gmEmpty("No catches logged today yet","Get out there and log one!"):daily.slice(0,10).map((e,i)=>rankRowHTML(e,i)).join('')}`;
  }
  if(lbView==='lifetime'){
    const all = flattenCatches(meFilter);
    return `<div class="wood-banner">BEST FISH ALL TIME</div>${all.length===0?gmEmpty("No catches logged yet","Be the first!"):all.slice(0,10).map((e,i)=>rankRowHTML(e,i)).join('')}`;
  }
  // location view
  const spots = [...new Set(state.sessions.filter(meFilter).map(s=>s.spotName))].filter(Boolean);
  let blocks = '';
  spots.forEach(spot => {
    const top = flattenCatches(s => s.spotName === spot && meFilter(s));
    if(!top.length) return;
    blocks += `<div class="spot-block"><div class="spot-title" style="color:#FFD34D;">📍 ${esc(spot)}</div>${rankRowHTML(top[0],0)}</div>`;
  });
  return `
    <div class="wood-banner">BEST FISH BY LOCATION</div>
    <div id="spotsMapEl" style="border-radius:14px;overflow:hidden;margin-bottom:14px;height:190px;"></div>
    ${spots.length===0 ? gmEmpty("No fishing spots logged yet") : blocks}
  `;
}

function initSpotsMap(){
  const el = document.getElementById('spotsMapEl');
  if(!el || typeof L === 'undefined') return;
  spotsMap = L.map('spotsMapEl').setView([39.8283,-98.5795], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(spotsMap);
  const groups = {};
  state.sessions.forEach(s => {
    if(s.lat==null || s.lng==null) return;
    if(!groups[s.spotName]) groups[s.spotName] = {lat:s.lat, lng:s.lng, catches:0};
    groups[s.spotName].catches += (s.catches||[]).length;
  });
  const bounds = [];
  Object.entries(groups).forEach(([name,d]) => {
    L.marker([d.lat,d.lng], {icon: pinIcon()}).addTo(spotsMap).bindPopup(`<b>${esc(name)}</b><br>${d.catches} catches logged`);
    bounds.push([d.lat,d.lng]);
  });
  if(bounds.length>1) spotsMap.fitBounds(bounds, {padding:[30,30]});
  else if(bounds.length===1) spotsMap.setView(bounds[0], 12);
}

/* =========================================================
   LOCATIONS TAB — waterway registry
========================================================= */
function getAllLocations(){
  const map = {};
  state.spots.forEach(sp => { map[sp.name] = {...sp}; });
  state.sessions.forEach(s => {
    if(!s.spotName) return;
    if(!map[s.spotName]){
      map[s.spotName] = { id:'auto_'+s.spotName, name:s.spotName, type:'freshwater', lat:s.lat, lng:s.lng, addedBy:null, auto:true };
    } else if(map[s.spotName].lat==null && s.lat!=null){
      map[s.spotName].lat = s.lat; map[s.spotName].lng = s.lng;
    }
  });
  return Object.values(map);
}

function locThumbColor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  const palette = ['#1D6FC4','#1F9E92','#7B3FC4','#E07B1D','#2E86D8','#4E8C2A'];
  return palette[hash % palette.length];
}

function locationCardHTML(loc){
  const best = flattenCatches(s=>s.spotName===loc.name)[0];
  const bestText = best ? `${best.catch.weight!=null?best.catch.weight+' lb':best.catch.length!=null?best.catch.length+' in':'Logged'} — ${esc(best.catch.species||'fish')}` : 'No catches yet';
  const coordsText = loc.lat!=null ? `${Number(loc.lat).toFixed(4)}°, ${Number(loc.lng).toFixed(4)}°` : 'No pin yet';
  return `
    <div class="loc-card">
      <div class="loc-thumb" style="background:${locThumbColor(loc.name)};">${loc.type==='saltwater'?'🌊':'🏞️'}</div>
      <div class="loc-mid">
        <div class="loc-name">${esc(loc.name)}</div>
        <div class="loc-coords">${coordsText}</div>
        <div class="loc-best">🏆 ${bestText}</div>
      </div>
      <button class="loc-arrow" onclick="viewLocationBoard()">›</button>
    </div>
  `;
}

function viewLocationBoard(){
  lbView = 'spots';
  setTab('leaderboards');
}

function renderLocations(){
  const locs = getAllLocations().filter(l => (l.type||'freshwater') === locTab);
  return `
    <div class="gm-screen gm-theme-orange">
      <div class="gm-header">
        <span class="gm-hicon">🗺️</span>
        <span class="gm-htitle">LOCATIONS</span>
        <button class="gm-close" onclick="setTab('home')">✕</button>
      </div>
      <div class="gm-tabs">
        <button class="gm-tab ${locTab==='freshwater'?'active':''}" onclick="locTab='freshwater';addingLocation=false;render()">FRESHWATER</button>
        <button class="gm-tab ${locTab==='saltwater'?'active':''}" onclick="locTab='saltwater';addingLocation=false;render()">SALTWATER</button>
      </div>
      <div class="gm-body">
        ${addingLocation ? renderAddLocationForm() : ''}
        ${(locs.length===0 && !addingLocation) ? gmEmpty("No spots here yet","Add one below to get started.") : locs.map(locationCardHTML).join('')}
      </div>
      <div class="gm-footer">
        <button class="gm-back-btn" onclick="setTab('home')">←</button>
        <button class="gm-action-btn green" onclick="toggleAddLocation()">${addingLocation?'✕ CANCEL':'➕ ADD LOCATION'}</button>
      </div>
    </div>
  `;
}

function toggleAddLocation(){
  addingLocation = !addingLocation;
  if(addingLocation) newLocDraft = { name:'', type: locTab, lat:null, lng:null };
  render();
}

function renderAddLocationForm(){
  return `
    <div class="add-loc-form">
      <input placeholder="Spot name (e.g. Miller's Pond)" value="${esc(newLocDraft.name)}" oninput="newLocDraft.name=this.value">
      <div class="add-loc-type">
        <button class="${newLocDraft.type==='freshwater'?'active':''}" onclick="newLocDraft.type='freshwater';render()">🏞️ Freshwater</button>
        <button class="${newLocDraft.type==='saltwater'?'active':''}" onclick="newLocDraft.type='saltwater';render()">🌊 Saltwater</button>
      </div>
      <div id="locAddMap"></div>
      <button class="btn btn-ghost" id="locAddBtn" onclick="useLocationPin()" style="margin-bottom:10px;width:100%;">📍 Drop a Pin (use my location)</button>
      <button class="gm-action-btn green" style="width:100%;" onclick="saveNewLocation()">Save Location</button>
    </div>
  `;
}

function initLocAddMap(){
  const el = document.getElementById('locAddMap');
  if(!el || typeof L === 'undefined') return;
  locMap = L.map('locAddMap').setView([39.8283,-98.5795], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(locMap);
  locAddMarker = null;
  locMap.on('click', (e) => setLocPin(e.latlng.lat, e.latlng.lng));
  if(newLocDraft.lat != null) setLocPin(newLocDraft.lat, newLocDraft.lng, true);
}

function setLocPin(lat, lng, skipZoom){
  newLocDraft.lat = lat; newLocDraft.lng = lng;
  if(locAddMarker){ locAddMarker.setLatLng([lat,lng]); }
  else{
    locAddMarker = L.marker([lat,lng], {draggable:true, icon: pinIcon()}).addTo(locMap);
    locAddMarker.on('dragend', () => { const p = locAddMarker.getLatLng(); newLocDraft.lat=p.lat; newLocDraft.lng=p.lng; });
  }
  if(!skipZoom) locMap.setView([lat,lng], 13);
}

function useLocationPin(){
  const btn = document.getElementById('locAddBtn');
  if(!navigator.geolocation){ btn.innerHTML = "GPS not available — tap the map"; return; }
  btn.innerHTML = '📍 Locating…';
  navigator.geolocation.getCurrentPosition(
    (pos) => { setLocPin(pos.coords.latitude, pos.coords.longitude); btn.innerHTML = '📍 Location Pinned ✓ — drag to adjust'; },
    () => { btn.innerHTML = "Couldn't get GPS — tap the map to drop a pin"; },
    {enableHighAccuracy:true, timeout:8000}
  );
}

async function saveNewLocation(){
  if(!newLocDraft.name.trim()) return;
  state.spots.push({ id:`loc_${Date.now()}`, name:newLocDraft.name.trim(), type:newLocDraft.type, lat:newLocDraft.lat, lng:newLocDraft.lng, addedBy: state.me, createdAt: new Date().toISOString() });
  await persistSpots();
  addingLocation = false;
  locTab = newLocDraft.type;
  render();
}
</script>
</body>
</html>
